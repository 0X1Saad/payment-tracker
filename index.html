<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Access guard: send to login if not signed in
    try {
      if (sessionStorage.getItem("payment_tracker_session") !== "1") {
        location.replace("login.html");
      }
    } catch (e) { location.replace("login.html"); }
  </script>
</head>
<body>

  <header class="top">
    <div class="wrap top-inner">
      <div>
        <h1>PAYMENT TRACKER</h1>
        <p>Assignments / Labs / Cisco</p>
      </div>
      <button type="button" class="btn btn-light" id="logoutBtn">LOGOUT</button>
    </div>
  </header>

  <main class="wrap">

    <!-- SUMMARY -->
    <section class="stats" aria-label="Summary">
      <div class="stat">
        <span class="stat-label">Total Work</span>
        <span class="stat-value" id="statTotal">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Pending</span>
        <span class="stat-value" id="statPendingCount">0</span>
        <span class="stat-sub" id="statPendingAmount">PKR 0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Completed</span>
        <span class="stat-value" id="statDoneCount">0</span>
        <span class="stat-sub" id="statDoneAmount">PKR 0</span>
      </div>
      <div class="stat stat-invert">
        <span class="stat-label">Total Amount</span>
        <span class="stat-value" id="statAmount">PKR 0</span>
      </div>
    </section>

    <!-- FORM -->
    <section class="panel">
      <h2 id="formTitle">ADD NEW ENTRY</h2>
      <form id="entryForm" autocomplete="off">
        <input type="hidden" id="entryId">

        <div class="grid">
          <div class="field">
            <label for="title">Title / Description</label>
            <input type="text" id="title" placeholder="e.g. Networking Lab 3" required>
          </div>

          <div class="field">
            <label for="client">Client Name</label>
            <input type="text" id="client" placeholder="Who is paying?" required>
          </div>

          <div class="field">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Assignment">Assignment</option>
              <option value="Lab">Lab</option>
              <option value="Cisco">Cisco</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="amount">Amount (PKR)</label>
            <input type="number" id="amount" min="0" step="1" placeholder="0" required>
          </div>

          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>

          <div class="field">
            <label for="status">Payment Status</label>
            <select id="status" required>
              <option value="Pending">Pending</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="notes">Notes (optional)</label>
          <input type="text" id="notes" placeholder="Any extra detail">
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-solid" id="submitBtn">ADD ENTRY</button>
          <button type="button" class="btn" id="cancelBtn" hidden>CANCEL EDIT</button>
        </div>
      </form>
    </section>

    <!-- TOOLBAR -->
    <section class="toolbar" aria-label="Filters">
      <div class="field grow">
        <label for="search">Search</label>
        <input type="text" id="search" placeholder="Title, client or notes">
      </div>
      <div class="field">
        <label for="filterStatus">Status</label>
        <select id="filterStatus">
          <option value="All">All</option>
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="field">
        <label for="filterCategory">Category</label>
        <select id="filterCategory">
          <option value="All">All</option>
          <option value="Assignment">Assignment</option>
          <option value="Lab">Lab</option>
          <option value="Cisco">Cisco</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="sortBy">Sort</label>
        <select id="sortBy">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="amountHigh">Amount: high to low</option>
          <option value="amountLow">Amount: low to high</option>
        </select>
      </div>
      <div class="toolbar-btns">
        <button type="button" class="btn" id="exportBtn">EXPORT CSV</button>
        <button type="button" class="btn" id="clearBtn">CLEAR ALL</button>
      </div>
    </section>

    <!-- TABLE -->
    <section class="table-wrap">
      <table id="entryTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Date</th>
            <th>Title</th>
            <th>Client</th>
            <th>Category</th>
            <th class="num">Amount</th>
            <th>Status</th>
            <th class="act-col">Actions</th>
          </tr>
        </thead>
        <tbody id="entryBody"></tbody>
      </table>
      <p class="empty" id="emptyMsg" hidden>NO ENTRIES FOUND</p>
    </section>

  </main>

  <footer class="foot">
    <div class="wrap">Data is saved in this browser only (localStorage).</div>
  </footer>

  <script>
    document.getElementById("logoutBtn").addEventListener("click", function () {
      try { sessionStorage.removeItem("payment_tracker_session"); } catch (e) {}
      location.replace("login.html");
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
